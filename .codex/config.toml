# サンドボックスと承認の大枠の設定。コマンド単位の allow / prompt / forbidden は rules/default.rules。
approval_policy = "on-request"
# Codex のサンドボックス（bubblewrap）は Linux の名前空間を作る必要があるが、Docker の既定の seccomp がそれを禁止している。
# workspace-write ではシェルコマンドが 1 つも動かないため、コンテナを隔離の境界とみなしてサンドボックスを外す。
# 提出の確認と .env の閲覧禁止は rules/default.rules で引き続き効く。
sandbox_mode = "danger-full-access"
